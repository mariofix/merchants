[project]
name = "merchants-sdk"
version = "2026.5.1"
description = "Payments for people who have better things to do."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"
dependencies = ["pydantic>=2.13.4", "requests>=2.34.2"]

[project.optional-dependencies]
flow = ["pyflowcl (>=2026.5.0,<2027.0.0)"]
khipu = ["khipu-tools (>=2025.1.0,<2027.0.0)"]
cli = ["typer>=0.26.8"]
sqlalchemy = ["sqlalchemy>=2.0.51"]
dev = [
  "pytest>=9.1.1",
  "pytest-cov",
  "ruff",
  "responses>=0.26.2",
  "typer>=0.26.8",
  "sqlalchemy>=2.0.51",
  "pre-commit",
  "mkdocs>=1.6.1",
  "mkdocs-material>=9.7.6",
  "mkdocstrings[python]>=1.0.6",
]

[project.urls]
homepage = "https://github.com/mariofix/merchants/"
repository = "https://github.com/mariofix/merchants/"
documentation = "https://mariofix.github.io/merchants/"


[tool.poetry]
packages = [{ include = "merchants" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
merchants = "merchants.cli:app"


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
